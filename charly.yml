#  opencharly/pod-kde-nested — a full KDE Plasma session nested in a host Wayland
#  compositor, as one supervised service any pod can compose.
#
#    <host compositor> (sway / pixelflux / the cstream streamer)  ── KDE_NESTED_HOST_DISPLAY
#        └─ kwin_wayland --wayland-display <host> --socket <KDE_NESTED_SOCKET>
#              └─ plasmashell + KDE applications
#
#  The pod that composes this leaf supplies the host compositor and the transport (VNC,
#  selkies, cstream) and sets the KDE_NESTED_* knobs for its own socket layout.

kde-nested:
    candy:
        description: |
            A full KDE Plasma session nested in a host Wayland compositor: the
            kde-nested-session launcher, run as the supervised kde-nested service, waits
            for the host's socket, starts kwin_wayland NESTED in it
            (--wayland-display <host> --socket <own socket>) and plasmashell on KWin's
            socket. The composing pod chooses the host socket, KWin's socket, the runtime
            dir, an optional fixed size and whether Plasma uses the pod's shared session
            bus or a private one, through the KDE_NESTED_* environment. Composes the
            SDDM-free Plasma package set (layer-kde-shell, which brings the session bus)
            and strips cap_sys_nice from kwin_wayland so it execs under the pod's
            no-new-privileges. Every claim is observable: the launcher and the stripped
            capability at build time, and at runtime the RUNNING service and plasmashell.
            Which bus Plasma is on is the composing pod's choice, so KWin's renderer is
            asserted by each pod's own bed, on the bus it chose.
        require:
            - '@github.com/opencharly/layer-kde-shell:v2026.326.2019'
        env:
            KDE_NESTED_HOST_DISPLAY: wayland-0
            KDE_NESTED_SOCKET: wayland-kde
            KDE_NESTED_RUNTIME_DIR: ""
            KDE_NESTED_RESOLUTION: ""
            KDE_NESTED_BUS: session
        env_accept:
            - name: KDE_NESTED_HOST_DISPLAY
              description: "The host compositor's Wayland socket KWin nests into. Default: wayland-0"
            - name: KDE_NESTED_SOCKET
              description: "The Wayland socket the nested KWin serves to Plasma and its apps. Default: wayland-kde"
            - name: KDE_NESTED_RUNTIME_DIR
              description: "The XDG_RUNTIME_DIR holding both sockets. Default: the inherited XDG_RUNTIME_DIR, else /tmp"
            - name: KDE_NESTED_RESOLUTION
              description: "WxH of KWin's window; empty takes the size the host configures. Default: empty"
            - name: KDE_NESTED_BUS
              description: "session (the pod's shared session bus) or private (a bus of its own). Default: session"
        service:
            - name: kde-nested
              exec: "%(ENV_HOME)s/.local/bin/kde-nested-session"
              restart: always
              priority: 15
              start_sec: 3
              enable: true
              # user scope: a desktop session belongs to the deploy user's session (its
              # bus and XDG_RUNTIME_DIR from the user manager on a systemd venue); in a
              # supervisord pod it runs the same way.
              scope: user
        plan:
            - run: mkdir=${HOME}/.local/bin
              mkdir: "${HOME}/.local/bin"
              run_as: "${USER}"
            - run: copy=kde-nested-session
              copy: kde-nested-session
              to: "${HOME}/.local/bin/kde-nested-session"
              mode: "0755"
              run_as: "${USER}"
            - run: strip cap_sys_nice from kwin_wayland so it execs as a nested compositor under the pod's no-new-privileges
              id: kde-nested-strip-caps
              run_as: root
              command: |
                setcap -r /usr/bin/kwin_wayland
            - check: the kde-nested-session launcher is installed and executable
              id: kde-nested-launcher
              file:
                file: ${HOME}/.local/bin/kde-nested-session
                exists: true
                mode: "0755"
            - check: the launcher starts KWin nested in the host compositor and serving its own socket
              id: kde-nested-launcher-nests
              file:
                file: ${HOME}/.local/bin/kde-nested-session
                contains:
                    - contains: 'kwin_wayland --wayland-display "$HOST" --socket "$SOCK"'
            - check: the launcher's private-bus branch re-execs itself under a bus of its own (`dbus-run-session`), and its resolution handling builds the width/height flags from KDE_NESTED_RESOLUTION
              id: kde-nested-launcher-private-bus-and-resolution
              file:
                file: ${HOME}/.local/bin/kde-nested-session
                contains:
                    - contains: 'KDE_NESTED_BUS=session exec dbus-run-session -- "$0"'
                    - contains: 'SIZE="--width ${RES%x*} --height ${RES#*x}"'
            - check: kwin_wayland carries no file capability, so it execs under no-new-privileges
              id: kde-nested-kwin-no-caps
              exit_status: 0
              command: |
                # Report to STDERR, not stdout: the runner records a failing check's stderr in
                # its reason, so this is the difference between "exit=1" and knowing WHICH
                # capability survived and which package put it there (measured failure of
                # run 2026.327.1707 carried only "exit=1 (stderr: )").
                caps=$(getcap /usr/bin/kwin_wayland 2>/dev/null)
                if [ -n "$caps" ]; then
                  {
                    echo "kwin_wayland still has caps: $caps"
                    echo "file: $(ls -l /usr/bin/kwin_wayland 2>&1)"
                    echo "pkg:  $(pacman -Qo /usr/bin/kwin_wayland 2>&1 | head -1)"
                  } >&2
                  exit 1
                fi
                echo "no caps"
            - check: kdotool is installed, the wl verb's KWin window backend
              id: kde-nested-kdotool
              file:
                file: /usr/bin/kdotool
                exists: true
            - check: the nested Plasma session runs under supervisord
              id: kde-nested-running
              context: [runtime]
              service:
                service: kde-nested
                running: true
            - check: plasmashell is running on KWin's socket
              id: kde-nested-plasmashell
              context: [runtime]
              eventually: 90s
              retry_interval: 3s
              exit_status: 0
              command:
                command: pgrep -x plasmashell
                in_container: true

kde-nested-skill:
    skill:
        name: kde-nested
        family: selkies
        owner: kde-nested
        triggers:
            - pod-kde-nested
            - kde-nested
            - kde-nested-session
            - nested KDE Plasma session
            - KWin nested in a Wayland compositor
            - KDE_NESTED_HOST_DISPLAY
            - KDE_NESTED_BUS
